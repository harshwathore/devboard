# Goal: To deploy the build images from CI steps once the CI workflow is Succeeded

name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - 'my-devboard-branch'

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Copy Example Env to main env
        run: cp .env.example .env
      
      - name: Docker setup [Login]
        uses: docker/login-action@v4
        with:
                username: ${{vars.DOCKERHUB_USERNAME}}
                password: ${{secrets.DOCKERHUB_TOKEN}}

      - name: Deploy the containers with Docker Compose
        run: |
          docker compose pull
          docker compose up -d

    